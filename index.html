<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天津市大学生化学竞赛 - 在线学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #16a34a;
            --warning-color: #ea580c;
            --danger-color: #dc2626;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        /* ======================== 导航栏 ======================== */

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-menu {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .navbar-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .navbar-menu a:hover,
        .navbar-menu a.active {
            color: var(--primary-color);
        }

        .navbar-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            display: none;
            z-index: 100;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a,
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            color: var(--text-primary);
            transition: background 0.3s;
            font-size: 14px;
        }

        .dropdown-menu a:hover,
        .dropdown-menu button:hover {
            background: var(--light-bg);
        }

        /* ======================== 认证页面 ======================== */

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
        }

        .auth-tab {
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .auth-form {
            display: none;
        }

        .auth-form.show {
            display: block;
        }

        /* ======================== 仪表板 ======================== */

        .dashboard {
            padding: 40px 0;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-unit {
            font-size: 14px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .exam-list {
            display: grid;
            gap: 16px;
        }

        .exam-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            border-left: 4px solid var(--primary-color);
        }

        .exam-info h3 {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .exam-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .exam-actions {
            display: flex;
            gap: 12px;
        }

        /* ======================== 响应式设计 ======================== */

        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 24px;
            }

            .exam-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .exam-actions {
                width: 100%;
                margin-top: 12px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar" style="display: none;">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    🧪 化学竞赛平台
                </div>
                <ul class="navbar-menu" id="navMenu">
                    <li><a href="javascript:showPage('dashboard')" class="nav-link active">仪表板</a></li>
                    <li><a href="javascript:showPage('exams')" class="nav-link">练习考试</a></li>
                    <li><a href="javascript:showPage('wrong-questions')" class="nav-link">错题库</a></li>
                    <li id="teacherNav" style="display: none;">
                        <a href="javascript:showPage('teacher')" class="nav-link">教师管理</a>
                    </li>
                </ul>
                <div class="navbar-right">
                    <div style="position: relative;">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <div class="dropdown-menu" id="userMenu">
                            <button onclick="logout()">退出登录</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container" id="mainContent">
        <!-- 认证页面 -->
        <div id="authPage" class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">🧪 化学竞赛平台</h2>
                <p class="auth-subtitle">专业的在线学习助手</p>

                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">登录</button>
                    <button class="auth-tab" onclick="switchTab('register')">注册</button>
                </div>

                <div class="alert" id="authAlert"></div>

                <!-- 登录表单 -->
                <form class="auth-form show" id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="loginEmail" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        登录
                    </button>
                </form>

                <!-- 注册表单 -->
                <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" placeholder="输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" placeholder="至少8个字符" required>
                    </div>
                    <div class="form-group">
                        <label>身份</label>
                        <select id="regRole">
                            <option value="student">学生</option>
                            <option value="teacher">教师</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        创建账户
                    </button>
                </form>
            </div>
        </div>

        <!-- 仪表板页面 -->
        <div id="dashboardPage" style="display: none;">
            <div style="margin-bottom: 40px; margin-top: 40px;">
                <h1 style="color: white; font-size: 32px; margin-bottom: 8px;">欢迎回来，<span id="userName">用户</span></h1>
                <p style="color: rgba(255,255,255,0.8);">继续你的学习之旅</p>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">总做题数</div>
                    <div class="stat-value"><span id="totalAttempts">0</span><span class="stat-unit">次</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✓</div>
                    <div class="stat-label">正确率</div>
                    <div class="stat-value"><span id="accuracy">0</span><span class="stat-unit">%</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-label">连续正确</div>
                    <div class="stat-value"><span id="streak">0</span><span class="stat-unit">个</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-label">学习时长</div>
                    <div class="stat-value"><span id="studyHours">0</span><span class="stat-unit">小时</span></div>
                </div>
            </div>

            <div style="background: white; border-radius: 12px; padding: 24px; margin-top: 40px;">
                <h2 style="margin-bottom: 24px;">📚 最近考试</h2>
                <div id="recentExams" class="exam-list">
                    <p style="color: var(--text-secondary);">正在加载...</p>
                </div>
            </div>
        </div>

        <!-- 考试列表页面 -->
        <div id="examsPage" style="display: none; padding: 40px 0;">
            <h1 style="color: white; margin-bottom: 32px;">📚 练习考试</h1>
            <div id="examsList" class="exam-list">
                <p style="color: white;">正在加载考试列表...</p>
            </div>
        </div>

        <!-- 错题库页面 -->
        <div id="wrongQuestionsPage" style="display: none; padding: 40px 0;">
            <h1 style="color: white; margin-bottom: 32px;">📌 我的错题库</h1>
            <div id="wrongQuestionsList" class="exam-list">
                <p style="color: white;">正在加载错题...</p>
            </div>
        </div>

        <!-- 教师管理页面 -->
        <div id="teacherPage" style="display: none; padding: 40px 0;">
            <h1 style="color: white; margin-bottom: 32px;">👨‍🏫 教师管理面板</h1>
            <div class="card">
                <p>教师功能即将上线...</p>
            </div>
        </div>
    </div>

    <!-- Supabase客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ============================================================================
        // 核心配置 - 确保只创建一次 supabase 实例
        // ============================================================================

        const SUPABASE_URL = 'https://qobxbdlwfoyzwokjcdpy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvYnhiZGx3Zm95endva2pjZHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1ODYzNjYsImV4cCI6MjEwNzE2MjM2Nn0._Sfo8seOCZ0AMHZig0GSsUVTZoQA60t4MK9JY9ukQBw';

        // 防止重复创建，检查是否已存在
        let supabaseClient = null;
        
        function getSupabaseClient() {
            if (!supabaseClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }

        // 简化引用
        const supabase = new Proxy({}, {
            get: function(target, prop) {
                return getSupabaseClient()[prop];
            }
        });

        // 应用状态
        let appState = {
            currentUser: null,
            currentPage: 'dashboard',
            authMode: 'login'
        };

        // ============================================================================
        // 认证管理
        // ============================================================================

        async function handleLogin(e) {
            e.preventDefault();
            try {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                const client = getSupabaseClient();
                const { data, error } = await client.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) throw new Error(error.message);
                
                appState.currentUser = data.user;
                await loadUserProfile();
                showAlert('登录成功！', 'success');
                setTimeout(() => showPage('dashboard'), 500);
            } catch (error) {
                showAlert('登录失败：' + error.message, 'danger');
                console.error('登录错误:', error);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            try {
                const username = document.getElementById('regUsername').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                const role = document.getElementById('regRole').value;

                const client = getSupabaseClient();
                const { data, error } = await client.auth.signUp({
                    email,
                    password
                });

                if (error) throw new Error(error.message);

                // 创建用户档案
                const { error: profileError } = await client
                    .from('users')
                    .insert([{
                        id: data.user.id,
                        email,
                        username,
                        role
                    }]);

                if (profileError) throw new Error(profileError.message);

                showAlert('注册成功！请检查邮箱验证链接。', 'success');
                setTimeout(() => {
                    appState.authMode = 'login';
                    switchTab('login');
                }, 2000);
            } catch (error) {
                showAlert('注册失败：' + error.message, 'danger');
                console.error('注册错误:', error);
            }
        }

        async function logout() {
            try {
                const client = getSupabaseClient();
                await client.auth.signOut();
                appState.currentUser = null;
                showPage('auth');
            } catch (error) {
                showAlert('退出登录失败：' + error.message, 'danger');
            }
        }

        async function loadUserProfile() {
            if (!appState.currentUser) return;

            try {
                const client = getSupabaseClient();
                const { data, error } = await client
                    .from('users')
                    .select('*')
                    .eq('id', appState.currentUser.id)
                    .single();

                if (error) {
                    console.warn('用户档案未找到，这是第一次登录');
                    appState.currentUser.username = appState.currentUser.email.split('@')[0];
                } else {
                    appState.currentUser = { ...appState.currentUser, ...data };
                }
                
                updateUserUI();
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        function updateUserUI() {
            const user = appState.currentUser;
            const displayName = user?.username || user?.email?.split('@')[0] || '用户';
            document.getElementById('userName').textContent = displayName;
            document.getElementById('userAvatar').textContent = displayName[0].toUpperCase();

            // 显示/隐藏教师菜单
            const teacherNav = document.getElementById('teacherNav');
            if (user?.role === 'teacher' || user?.role === 'admin') {
                teacherNav.style.display = 'block';
            } else {
                teacherNav.style.display = 'none';
            }
        }

        // ============================================================================
        // UI管理
        // ============================================================================

        function showPage(page) {
            appState.currentPage = page;

            // 隐藏所有页面
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'none';
            document.getElementById('examsPage').style.display = 'none';
            document.getElementById('wrongQuestionsPage').style.display = 'none';
            document.getElementById('teacherPage').style.display = 'none';

            // 显示指定页面
            if (page === 'auth') {
                document.getElementById('authPage').style.display = 'flex';
                document.getElementById('navbar').style.display = 'none';
            } else {
                document.getElementById('navbar').style.display = 'block';
                
                switch (page) {
                    case 'dashboard':
                        document.getElementById('dashboardPage').style.display = 'block';
                        loadDashboard();
                        break;
                    case 'exams':
                        document.getElementById('examsPage').style.display = 'block';
                        loadExams();
                        break;
                    case 'wrong-questions':
                        document.getElementById('wrongQuestionsPage').style.display = 'block';
                        loadWrongQuestions();
                        break;
                    case 'teacher':
                        document.getElementById('teacherPage').style.display = 'block';
                        break;
                }
            }
        }

        function showAlert(message, type = 'info') {
            const alertEl = document.getElementById('authAlert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3000);
        }

        function switchTab(tab) {
            appState.authMode = tab;
            
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('show'));
            
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm').classList.add('show');
        }

        // ============================================================================
        // 数据加载函数
        // ============================================================================

        async function loadDashboard() {
            try {
                const client = getSupabaseClient();
                
                // 加载用户统计
                const { data: stats } = await client
                    .from('user_stats')
                    .select('*')
                    .eq('user_id', appState.currentUser.id)
                    .single();

                document.getElementById('totalAttempts').textContent = stats?.total_attempts || 0;
                document.getElementById('accuracy').textContent = Math.round(stats?.accuracy_rate || 0);
                document.getElementById('streak').textContent = stats?.current_streak || 0;
                document.getElementById('studyHours').textContent = Math.round((stats?.total_time_spent || 0) / 3600);

                // 加载最近考试
                const { data: recent } = await client
                    .from('practice_records')
                    .select('*, exams(*)')
                    .eq('user_id', appState.currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(5);

                const recentExamsEl = document.getElementById('recentExams');
                recentExamsEl.innerHTML = '';

                if (recent && recent.length > 0) {
                    recent.forEach(record => {
                        const exam = record.exams;
                        recentExamsEl.innerHTML += `
                            <div class="exam-item">
                                <div class="exam-info">
                                    <h3>${exam?.title || '未知考试'}</h3>
                                    <div class="exam-meta">
                                        <span>📅 ${new Date(record.created_at).toLocaleDateString()}</span>
                                        <span>📊 ${record.obtained_score}/${record.total_score}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    recentExamsEl.innerHTML = '<p style="color: var(--text-secondary); padding: 20px; text-align: center;">还没有完成过任何考试</p>';
                }
            } catch (error) {
                console.error('加载仪表板失败:', error);
                showAlert('加载数据失败，请刷新页面重试', 'danger');
            }
        }

        async function loadExams() {
            try {
                const client = getSupabaseClient();
                const { data, error } = await client
                    .from('exams')
                    .select('*')
                    .eq('status', 'published')
                    .order('year', { ascending: false });

                if (error) throw error;

                const examsList = document.getElementById('examsList');
                examsList.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(exam => {
                        examsList.innerHTML += `
                            <div class="exam-item">
                                <div class="exam-info">
                                    <h3>${exam.title}</h3>
                                    <div class="exam-meta">
                                        <span>📅 ${exam.year || '年份未定'}年</span>
                                        <span>⏱️ ${exam.duration_minutes}分钟</span>
                                        <span>📊 满分${exam.total_score}分</span>
                                    </div>
                                </div>
                                <div class="exam-actions">
                                    <button class="btn btn-primary btn-small" onclick="alert('练习功能即将推出')">开始练习</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    examsList.innerHTML = '<div class="card"><p style="color: var(--text-secondary); text-align: center; padding: 40px;">暂无发布的考试</p></div>';
                }
            } catch (error) {
                console.error('加载考试失败:', error);
                showAlert('加载考试失败，请重试', 'danger');
            }
        }

        async function loadWrongQuestions() {
            try {
                const client = getSupabaseClient();
                const { data, error } = await client
                    .from('wrong_questions')
                    .select('*, questions(*)')
                    .eq('user_id', appState.currentUser.id)
                    .order('last_reviewed_at', { ascending: false });

                if (error) throw error;

                const list = document.getElementById('wrongQuestionsList');
                list.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(item => {
                        const question = item.questions;
                        list.innerHTML += `
                            <div class="card" style="border-left: 4px solid var(--danger-color);">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                                    <span style="font-weight: 600;">第${question.question_number}题</span>
                                    <span style="background: var(--danger-color); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">出错${item.incorrect_times}次</span>
                                </div>
                                <p style="color: var(--text-primary); margin-bottom: 12px;">${question.title}</p>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = '<div class="card"><p style="color: var(--text-secondary); text-align: center; padding: 40px;">你的错题库是空的，继续加油！</p></div>';
                }
            } catch (error) {
                console.error('加载错题库失败:', error);
            }
        }

        // ============================================================================
        // 初始化
        // ============================================================================

        async function initApp() {
            try {
                const client = getSupabaseClient();
                const { data: { session } } = await client.auth.getSession();
                
                if (session) {
                    appState.currentUser = session.user;
                    await loadUserProfile();
                    showPage('dashboard');
                } else {
                    showPage('auth');
                }
            } catch (error) {
                console.error('初始化应用失败:', error);
                showPage('auth');
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', initApp);

        // 用户菜单切换
        document.getElementById('userAvatar').addEventListener('click', () => {
            document.getElementById('userMenu').classList.toggle('show');
        });

        // 点击其他地方关闭菜单
        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('userMenu');
            const userAvatar = document.getElementById('userAvatar');
            if (!userMenu.contains(e.target) && !userAvatar.contains(e.target)) {
                userMenu.classList.remove('show');
            }
        });
    </script>
</body>
</html>
